name: Feature or protocol request
description: Something SAP RFC can do that this library cannot yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task, not the API you think would solve it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another library, ABAP-side workaround, or not at all.
